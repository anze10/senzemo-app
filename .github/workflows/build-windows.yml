name: Build Windows exe

on:
  workflow_dispatch: # ROČEN zagon preko "Actions" zavihka - klikneš "Run workflow"

jobs:
  build-windows:
    runs-on: windows-latest # pravi Windows stroj v oblaku

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
        with:
          ref: quick-push # vedno ta veja, koda je samo tukaj

      - name: Namesti Bun
        uses: oven-sh/setup-bun@v2

      - name: Namesti odvisnosti
        run: bun install

      - name: Ustvari .env
        shell: bash
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Preveri .env (debug - brez razkritja vsebine)
        shell: bash
        run: |
          echo "Število vrstic v .env: $(wc -l < .env)"
          echo "Ali DATABASE_URL obstaja: $(grep -c '^DATABASE_URL=' .env || echo 0)"

      - name: Zgradi Windows exe
        run: bun run electron:build

      - name: Naloži .exe kot prenosljiv artefakt
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
