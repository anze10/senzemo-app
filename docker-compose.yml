services:
  senzemo-db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: senzemo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # iz .env
      POSTGRES_DB: senzemo
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U senzemo" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    image: ghcr.io/anze10/senzemo-app:latest
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://senzemo:${POSTGRES_PASSWORD}@senzemo-db:5432/senzemo?sslmode=disable
    healthcheck:
      test: [ "CMD-SHELL", "bun -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      senzemo-db:
        condition: service_healthy
    networks:
      - internal
      - n8n_default
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.tool-nfc.entrypoints=web,websecure"
    - "traefik.http.routers.tool-nfc.rule=Host(`tool.senzemo.com`)"
    - "traefik.http.routers.tool-nfc.tls=true"
    - "traefik.http.routers.tool-nfc.tls.certresolver=mytlschallenge"
    - "traefik.http.services.tool-nfc.loadbalancer.server.port=3000"
    - "traefik.http.routers.tool-nfc.middlewares=tool-nfc-security"
    - "traefik.http.middlewares.tool-nfc-security.headers.stsSeconds=31536000"
    - "traefik.http.middlewares.tool-nfc-security.headers.stsIncludeSubdomains=true"
    - "traefik.http.middlewares.tool-nfc-security.headers.stsPreload=true"
    - "traefik.http.middlewares.tool-nfc-security.headers.contentTypeNosniff=true"
    - "traefik.http.middlewares.tool-nfc-security.headers.frameDeny=true"
    - "traefik.http.middlewares.tool-nfc-security.headers.referrerPolicy=strict-origin-when-cross-origin"
    - "traefik.http.middlewares.tool-nfc-security.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com; object-src 'none';"

  cron:
    image: curlimages/curl:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "while true; do
       sleep 86400;
        curl -X POST http://app:3000/api/send-inventory-report;
      done"
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
  n8n_default:
    external: true
